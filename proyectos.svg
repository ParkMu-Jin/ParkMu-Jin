<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="rayo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE6FF"/>
      <stop offset="1" stop-color="#2F63FF"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1647"/>
    </linearGradient>
    <pattern id="lineas" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000" fill-opacity="0.3"/>
    </pattern>
    <filter id="brillo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <polygon id="b" points="34,0 8,70 26,70 14,130 52,52 32,52 46,0"/>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, "DejaVu Sans Mono", monospace; }
    .tg { font-size: 34px; font-weight: 700; fill: #4D7CFF; letter-spacing: 4px; }
    .dd { font-size: 14px; fill: #DCE6FF; }
    .tag { font-size: 11px; font-weight: 700; fill: #9DB8FF; text-anchor: middle; }
    .bd { font-size: 11px; font-weight: 700; fill: #4D7CFF; text-anchor: middle; letter-spacing: 1px; }
    .k { font-size: 12px; fill: #4D7CFF; }
    .v { font-size: 12px; fill: #DCE6FF; }
    .p { font-size: 12px; fill: #3a4a7a; }
  </style>

  <rect width="1000" height="260" rx="12" fill="url(#fondo)" stroke="#2F63FF" stroke-opacity="0.7">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect width="1000" height="260" rx="12" fill="url(#lineas)"/>
  <rect x="0" y="24" width="4" height="212" fill="#2F63FF"/>

  <use href="#b" fill="url(#rayo)" filter="url(#brillo)" transform="translate(34 40) scale(1.5)">
    <animate attributeName="opacity" values="1;1;0.4;1;0.7;1;1" dur="3s" repeatCount="indefinite"/>
  </use>

  <text class="tg" x="130" y="64">MINISERVER</text>
  <rect x="860" y="22" width="116" height="26" rx="4" fill="#0A1E6E" stroke="#2F63FF" stroke-opacity="0.6"/>
  <text class="bd" x="918" y="39">DESTACADO</text>

  <text class="dd" x="130" y="102">Servidor de Minecraft que corre con los recursos de tu computadora</text>
  <text class="dd" x="130" y="124">para jugar con amigos conectados a tu red o mediante un túnel que</text>
  <text class="dd" x="130" y="146">crea una IP y un puerto remoto. Exclusivo para Bedrock y funcional con mods.</text>

  <rect x="130" y="176" width="90" height="26" rx="4" fill="#0A1E6E" stroke="#2F63FF" stroke-opacity="0.6"/>
  <text class="tag" x="175" y="193">BEDROCK</text>
  <rect x="230" y="176" width="70" height="26" rx="4" fill="#0A1E6E" stroke="#2F63FF" stroke-opacity="0.6"/>
  <text class="tag" x="265" y="193">MODS</text>
  <rect x="310" y="176" width="110" height="26" rx="4" fill="#0A1E6E" stroke="#2F63FF" stroke-opacity="0.6"/>
  <text class="tag" x="365" y="193">RED LOCAL</text>
  <rect x="430" y="176" width="140" height="26" rx="4" fill="#0A1E6E" stroke="#2F63FF" stroke-opacity="0.6"/>
  <text class="tag" x="500" y="193">TÚNEL REMOTO</text>

  <rect x="640" y="84" width="320" height="128" rx="8" fill="#02040a" stroke="#2F63FF" stroke-opacity="0.4"/>
  <circle cx="658" cy="100" r="4" fill="#2F63FF"/>
  <circle cx="674" cy="100" r="4" fill="#1d3fa8"/>
  <circle cx="690" cy="100" r="4" fill="#0f2266"/>
  <text class="p" x="660" y="130" xml:space="preserve">&gt; <tspan class="k">edicion</tspan><tspan class="p">: </tspan><tspan class="v">bedrock</tspan></text>
  <text class="p" x="660" y="150" xml:space="preserve">&gt; <tspan class="k">mods</tspan><tspan class="p">: </tspan><tspan class="v">soportados</tspan></text>
  <text class="p" x="660" y="170" xml:space="preserve">&gt; <tspan class="k">acceso</tspan><tspan class="p">: </tspan><tspan class="v">red local / túnel</tspan></text>
  <text class="p" x="660" y="190" xml:space="preserve">&gt; <tspan class="k">estado</tspan><tspan class="p">: </tspan><tspan class="v">en línea</tspan><tspan class="k">  █<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>

  <text class="p" x="130" y="238">// más proyectos próximamente</text>
</svg>
