<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02040a"/>
      <stop offset="1" stop-color="#0a1647"/>
    </linearGradient>
    <linearGradient id="rayo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE6FF"/>
      <stop offset="1" stop-color="#2F63FF"/>
    </linearGradient>
    <pattern id="rejilla" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2F63FF" stroke-opacity="0.18"/>
    </pattern>
    <pattern id="lineas" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.5" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <filter id="brillo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <polygon id="b" points="34,0 8,70 26,70 14,130 52,52 32,52 46,0"/>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, "DejaVu Sans Mono", monospace; }
    .titulo { font-size: 88px; font-weight: 700; letter-spacing: 4px; text-anchor: middle; }
    .sub { font-size: 17px; letter-spacing: 6px; text-anchor: middle; fill: #9DB8FF; }
    .hud { font-size: 12px; fill: #4D7CFF; letter-spacing: 2px; }
    .info { font-size: 14px; text-anchor: middle; fill: #DCE6FF; letter-spacing: 2px; }
  </style>

  <rect width="1000" height="280" rx="12" fill="url(#fondo)"/>
  <rect width="1000" height="280" rx="12" fill="url(#rejilla)"/>
  <rect width="1000" height="280" rx="12" fill="url(#lineas)"/>

  <g fill="url(#rayo)" filter="url(#brillo)">
    <use href="#b" transform="translate(70 60) scale(1.2)">
      <animate attributeName="opacity" values="1;1;0.3;1;0.6;1;1" dur="3s" repeatCount="indefinite"/>
    </use>
    <use href="#b" transform="translate(150 150) scale(0.6)">
      <animate attributeName="opacity" values="0.6;1;0.4;1;0.6" dur="2.2s" repeatCount="indefinite"/>
    </use>
    <use href="#b" transform="translate(880 60) scale(1.2)">
      <animate attributeName="opacity" values="1;0.5;1;1;0.3;1" dur="3.4s" repeatCount="indefinite"/>
    </use>
    <use href="#b" transform="translate(810 150) scale(0.6)">
      <animate attributeName="opacity" values="1;0.4;1;0.7;1" dur="2.6s" repeatCount="indefinite"/>
    </use>
  </g>

  <rect x="0" y="-40" width="1000" height="40" fill="#4D7CFF" fill-opacity="0.07">
    <animate attributeName="y" values="-40;280" dur="5s" repeatCount="indefinite"/>
  </rect>

  <g fill="none" stroke="#2F63FF" stroke-width="2" stroke-opacity="0.8">
    <path d="M16 40V16H40"/>
    <path d="M960 16H984V40"/>
    <path d="M16 240V264H40"/>
    <path d="M960 264H984V240"/>
  </g>

  <circle cx="34" cy="34" r="4" fill="#4D7CFF">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text class="hud" x="46" y="38">SYS.ONLINE</text>
  <text class="hud" x="966" y="38" text-anchor="end">PA // UTC-5</text>

  <g filter="url(#brillo)">
    <text class="titulo" x="500" y="150" fill="#2F63FF" fill-opacity="0.6">SAXUM DEV
      <animate attributeName="x" values="500;500;500;506;494;500;500;500" dur="4s" repeatCount="indefinite"/>
    </text>
    <text class="titulo" x="500" y="150" fill="#4D7CFF">SAXUM DEV</text>
  </g>

  <text class="sub" x="500" y="188">DESARROLLO Y GESTIÓN DE SOFTWARE</text>
  <text class="info" x="500" y="232">PANAMÁ  |  21 AÑOS  |  FULL STACK  |  ANDROID  |  IA</text>
  <text class="hud" x="500" y="256" text-anchor="middle">_
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
</svg>
